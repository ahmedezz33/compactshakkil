# CompactShakkil V1-clean — الأساس النظيف (19 فئة، الألف الخنجريّة مُخرَجة)
# صقل الرأس الموسّع على البيانات النظيفة. لا يمسّ V1/V1-noLS الأصليّين.

init_checkpoint: "compactshakkil_v1_nols/expanded_19.pt"

data:
  processed_dir: "data/processed_clean"    # ناتج clean_data.py (عتبة 0.99، الخنجريّة keep)
  max_seq_length: 300
  train_cap: 1200000
  val_cap: 3000

model:
  name: "CompactShakkil-V1-clean-19"
  d_model: 256
  nhead: 8
  num_encoder_layers: 4
  dim_feedforward: 1024
  dropout: 0.1
  max_position: 512

training:
  batch_size: 6
  gradient_accumulation: 10
  learning_rate: 5.0e-5     # أعلى قليلًا من noLS: الصفوف الأربعة الجديدة تتعلّم من الصفر
  weight_decay: 0.01
  warmup_steps: 500
  num_epochs: 1
  max_steps: 18000
  max_grad_norm: 1.0
  label_smoothing: 0.0
  scheduler: "cosine"

logging:
  output_dir: "outputs_v1_clean"
  log_interval: 200
  eval_interval: 2000
  use_wandb: false

device:
  use_cuda: true
  mixed_precision: "fp16"
  num_workers: 0
  pin_memory: true

seed: 42
