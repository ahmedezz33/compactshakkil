# CompactShakkil V1-noLS — صقل قصير من نقطة V1 بحذف label_smoothing
# الهدف: اختبار هل يشحذ حذفُ التنعيم الثقةَ ويحسّن الفرز (AUROC) دون خسارة الدقّة.
# لا يمسّ الأصل — يكتب في outputs_v1_nols. يبدأ من أوزان V1 (مفردات 41 رمزًا).

init_checkpoint: "compactshakkil_v1_baseline/best_model.pt"

data:
  raw_dir: "data/raw/tashkeela"
  processed_dir: "data/processed"
  max_seq_length: 300
  train_cap: 800000        # عيّنة تدريب (لا نحتاج كامل 5.6M لصقل قصير)
  val_cap: 3000            # عيّنة تحقّق سريعة أثناء التدريب

model:
  name: "CompactShakkil-V1-noLS"
  d_model: 256
  nhead: 8
  num_encoder_layers: 4
  dim_feedforward: 1024
  dropout: 0.1
  max_position: 512

training:
  batch_size: 6
  gradient_accumulation: 10
  learning_rate: 2.0e-5     # صغير جدًّا — إعادة تشكيل لطيفة لا تدريب من الصفر
  weight_decay: 0.01
  warmup_steps: 500
  num_epochs: 1
  max_steps: 12000          # سقف صارم (~نصف ساعة على GPU)
  max_grad_norm: 1.0
  label_smoothing: 0.0      # ← جوهر التجربة: بلا تنعيم
  scheduler: "cosine"

logging:
  output_dir: "outputs_v1_nols"
  log_interval: 200
  eval_interval: 2000       # نراقب الاتّجاه ونحفظ نقطة كل تقييم
  use_wandb: false
  wandb_project: "compactshakkil"

device:
  use_cuda: true
  mixed_precision: "fp16"
  num_workers: 0
  pin_memory: true

seed: 42
