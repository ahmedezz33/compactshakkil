# صقلٌ من V3-unified مع ترجيح الأمثلة الصعبة (الذهبيّ مرجع) + القرآن
init_checkpoint: "outputs_v3_unified/latest.pt"
data:
  gen_dir: "data/processed_clean"
  gen_cap: 500000
  val_cap: 8000
  max_seq_length: 300
  hard_path: "data/hard_train.txt"
  hard_repeat: 3           # تكرار الأمثلة الصعبة ×3 (ترجيح)
  quran_dir: "data/processed_quran"
  quran_repeat: 8
model: {name: "v3-hard", d_model: 256, nhead: 8, num_encoder_layers: 4, dim_feedforward: 1024, dropout: 0.1, max_position: 512}
training: {batch_size: 6, gradient_accumulation: 10, learning_rate: 2.0e-5, weight_decay: 0.01, warmup_steps: 200, max_steps: 8000, max_grad_norm: 1.0, label_smoothing: 0.0}
logging: {output_dir: "outputs_v3_hard", eval_interval: 1000}
device: {use_cuda: true, mixed_precision: "fp16", num_workers: 0, pin_memory: true}
seed: 42
